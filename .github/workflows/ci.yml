name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - name: Smoke test
        run: |
          node dist/cli.js --version
          node dist/cli.js --help

  linux-sandbox-verification:
    # Verify real OS-level network isolation on a capable Linux runner.
    # Runs only on ubuntu-latest (Linux); bwrap is installed via apt.
    # STRICT_NETWORK_ISOLATION=1 ensures any inability to establish verified
    # isolation fails the job rather than being silently skipped.
    #
    # NOTE: GitHub-hosted ubuntu-latest runners support unprivileged user
    # namespaces and bubblewrap since approximately late 2023. If this job
    # fails with "namespace-rejected", the runner image may have changed;
    # see docs/sandbox-ci.md for fallback guidance.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Install bubblewrap
        run: sudo apt-get install -y bubblewrap

      - name: Probe bwrap capability
        run: |
          bwrap --version
          bwrap --unshare-net --dev-bind / / true
          echo "bwrap probe: OK"

      - name: Run OS isolation test under strict mode
        run: npx vitest run --reporter=verbose src/__tests__/orchestrated-e2e.test.ts
        env:
          STRICT_NETWORK_ISOLATION: "1"
